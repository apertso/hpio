name: Android release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.3"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-apk-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
  NODE_VERSION: "22"
  NDK_VERSION: "29.0.14033849"

jobs:
  check:
    name: Check existing APKs
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.assets.outputs.skip }}
    steps:
      - name: Skip when this release already has both APKs
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "release" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          names=$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | join(",")')
          if [[ "$names" == *app-arm64-release.apk* && "$names" == *app-universal-release.apk* ]]; then
            echo "APKs are already attached to $RELEASE_TAG"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  apk:
    name: Build and upload APKs
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require a semver tag
        run: |
          version="${RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3 (got ${RELEASE_TAG}). The APK version is taken from this tag."
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          dest=frontend/src-tauri/gen/android/app/google-services.json
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > "$dest"
          else
            cp frontend/src-tauri/gen/android/app/google-services.example.json "$dest"
            echo "::warning::GOOGLE_SERVICES_JSON is not set. This APK will build, but push notifications will not work."
          fi

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 repository secret to the base64 contents of frontend/src-tauri/hpio-release-key.keystore. A new key cannot update an already installed app."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > frontend/src-tauri/hpio-release-key.keystore

      - name: Set app version from the release tag
        env:
          NO_COMMIT: "true"
        run: node scripts/bump-version.js "$APP_VERSION"

      - name: Build arm64 APK
        working-directory: frontend
        run: npx tauri android build --apk --target aarch64 --split-per-abi --ci

      - name: Keep arm64 APK
        run: |
          file=$(find frontend/src-tauri/gen/android/app/build/outputs/apk -path '*/release/*' -name 'app-arm64*.apk' ! -name '*unsigned*' ! -name '*unaligned*' -print -quit)
          if [ -z "$file" ]; then
            echo "::error::arm64 release APK was not produced"
            find frontend/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' || true
            exit 1
          fi
          cp "$file" "$RUNNER_TEMP/app-arm64-release.apk"

      - name: Build universal APK
        working-directory: frontend
        run: npx tauri android build --apk --ci

      - name: Keep universal APK
        run: |
          file=$(find frontend/src-tauri/gen/android/app/build/outputs/apk -path '*/release/*' -name 'app-universal-release.apk' ! -name '*unsigned*' ! -name '*unaligned*' -print -quit)
          if [ -z "$file" ]; then
            echo "::error::universal release APK was not produced"
            find frontend/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' || true
            exit 1
          fi
          cp "$file" "$RUNNER_TEMP/app-universal-release.apk"

      - name: Attach APKs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/app-arm64-release.apk#app-arm64-release.apk" \
            "$RUNNER_TEMP/app-universal-release.apk#app-universal-release.apk" \
            --clobber
