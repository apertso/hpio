name: Android release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.3"
        required: true
        type: string
      build_only:
        description: "Build APKs for timing without uploading to a release"
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.3"
        required: true
        type: string
      source_sha:
        description: "Commit used to build the release artifacts"
        required: true
        type: string
      publish:
        description: "Publish the draft after both APKs are attached"
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-apk-${{ inputs.build_only && 'benchmark-' || '' }}${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
  NODE_VERSION: "22"
  NDK_VERSION: "29.0.14033849"

jobs:
  check:
    name: Check existing APKs
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.assets.outputs.skip }}
    steps:
      - name: Skip when this release already has both APKs
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "release" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          names=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.state == "uploaded") | .name')
          if grep -Fxq 'app-arm64-release.apk' <<< "$names" &&
            grep -Fxq 'app-armv7-release.apk' <<< "$names"; then
            echo "APKs are already attached to $RELEASE_TAG"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  apk:
    name: Build and upload APKs
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VITE_API_BASE_URL: https://hpio.ru/api
    steps:
      - name: Require a semver tag
        run: |
          version="${RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3 (got ${RELEASE_TAG}). The APK version is taken from this tag."
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || (inputs.build_only && github.sha) || format('refs/tags/{0}', env.RELEASE_TAG) }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          dest=frontend/src-tauri/gen/android/app/google-services.json
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > "$dest"
          else
            cp frontend/src-tauri/gen/android/app/google-services.example.json "$dest"
            echo "::warning::GOOGLE_SERVICES_JSON is not set. This APK will build, but push notifications will not work."
          fi

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 repository secret to the base64 contents of frontend/src-tauri/hpio-release-key.keystore. A new key cannot update an already installed app."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > frontend/src-tauri/hpio-release-key.keystore

      - name: Set app version from the release tag
        env:
          NO_COMMIT: "true"
        run: node scripts/bump-version.js "$APP_VERSION"

      - name: Build ARM64 and ARMv7 APKs
        working-directory: frontend
        run: npx tauri android build --apk --target aarch64 armv7 --split-per-abi --ci

      - name: Verify and stage signed APKs
        shell: bash
        run: |
          apk_dir=frontend/src-tauri/gen/android/app/build/outputs/apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          stage_apk() {
            local apk="$1" abi="$2" filename="$3" native_abis
            "$tools/apksigner" verify "$apk"
            native_abis=$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && $3 ~ /\.so$/ { print $2 }' | sort -u)
            if [[ "$native_abis" != "$abi" ]]; then
              echo "::error::Expected $abi in $filename, found $native_abis."
              exit 1
            fi
            cp "$apk" "$RUNNER_TEMP/$filename"
          }
          stage_apk "$apk_dir/arm64/release/app-arm64-release.apk" arm64-v8a app-arm64-release.apk
          stage_apk "$apk_dir/arm/release/app-arm-release.apk" armeabi-v7a app-armv7-release.apk

      - name: Attach APKs to the release
        if: inputs.build_only != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          release=$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish,assets)
          if [[ -n "$SOURCE_SHA" ]] && [[ $(jq -r '.isDraft' <<< "$release") != true ]]; then
            echo "::error::Release $RELEASE_TAG must be a draft before uploading APKs."
            exit 1
          fi
          tag_sha=$(git ls-remote --tags --sort=refname origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | tail -n 1 | cut -f1)
          release_sha=${tag_sha:-$(jq -r '.targetCommitish' <<< "$release")}
          if [[ "$release_sha" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Release $RELEASE_TAG points to a different commit than the APKs."
            exit 1
          fi
          names=$(jq -r '.assets[] | select(.state == "uploaded") | .name' <<< "$release")
          missing=()
          for name in app-arm64-release.apk app-armv7-release.apk; do
            if ! grep -Fxq "$name" <<< "$names"; then
              missing+=("$RUNNER_TEMP/$name")
            fi
          done
          if ((${#missing[@]})); then
            gh release upload "$RELEASE_TAG" "${missing[@]}"
          fi

      - name: Publish the completed draft
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          names=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.state == "uploaded") | .name')
          for name in app-arm64-release.apk app-armv7-release.apk frontend-dist.tar.gz storybook-static.tar.gz backend-dist.tar.gz; do
            if ! grep -Fxq "$name" <<< "$names"; then
              echo "::error::Missing release asset: $name"
              exit 1
            fi
          done
          gh release edit "$RELEASE_TAG" --draft=false
