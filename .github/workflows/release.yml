name: Release (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.3"
        required: true
        type: string
      release_name:
        description: "Display name (defaults to tag)"
        required: false
        type: string
      notes:
        description: "Release notes (markdown)"
        required: false
        type: string
      publish:
        description: "Publish after all assets are attached (false = keep draft)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and Draft Release
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve the release source
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3 (got $RELEASE_TAG)."
            exit 1
          fi
          tag_sha=$(git ls-remote --tags --sort=refname origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | tail -n 1 | cut -f1)
          source_sha=${tag_sha:-$GITHUB_SHA}
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" | jq -sr --arg tag "$RELEASE_TAG" 'first(.[][] | select(.tag_name == $tag) | [.draft, .target_commitish] | @tsv) // ""')
          if [[ -n "$existing" ]]; then
            read -r draft draft_target <<< "$existing"
            if [[ "$draft" != true ]]; then
              echo "::error::Release $RELEASE_TAG is already published."
              exit 1
            fi
            if [[ -z "$tag_sha" && "$draft_target" != "$source_sha" ]]; then
              echo "::error::Existing draft $RELEASE_TAG targets a different commit."
              exit 1
            fi
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          RUN_ID=$(gh run list --workflow=build.yml --commit="$SOURCE_SHA" --status=success --limit=1 --json databaseId --jq '.[0].databaseId // empty')

          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful build found for commit $SOURCE_SHA. Ensure the 'Build & Package' workflow has completed successfully."
            exit 1
          fi

          echo "Downloading artifacts from run $RUN_ID..."
          gh run download $RUN_ID -n frontend-dist -D frontend/dist
          gh run download $RUN_ID -n frontend-storybook -D frontend/storybook-static
          gh run download $RUN_ID -n backend-dist -D backend/dist

      - name: Package artifacts
        run: |
          mkdir -p release-assets
          tar -czf release-assets/frontend-dist.tar.gz -C frontend dist
          tar -czf release-assets/storybook-static.tar.gz -C frontend storybook-static
          tar -czf release-assets/backend-dist.tar.gz -C backend dist

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.tag }}
          body: ${{ inputs.notes }}
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            release-assets/frontend-dist.tar.gz
            release-assets/storybook-static.tar.gz
            release-assets/backend-dist.tar.gz
          target_commitish: ${{ steps.source.outputs.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android-apk:
    name: Android APK
    needs: release
    uses: ./.github/workflows/android-apk.yml
    with:
      tag: ${{ inputs.tag }}
      source_sha: ${{ needs.release.outputs.source_sha }}
      publish: ${{ inputs.publish }}
    secrets: inherit
